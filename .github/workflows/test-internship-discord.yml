name: Test Internship Discord

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send fake internship alert
        env:
          INTERNSHIP_DISCORD_WEBHOOK_URL: ${{ secrets.INTERNSHIP_DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          from discord_notify import send_internship_alert

          send_internship_alert(
              company="Test Company",
              title="Software Engineering Intern",
              location="Toronto, ON",
              url="https://example.com/job",
              matches=["Profile A", "Profile B"],
              posted="Just posted",
              javascript_exposure="⚪ NONE",
          )

          print("SUCCEEDED: internship Discord alert sent")
          PY
