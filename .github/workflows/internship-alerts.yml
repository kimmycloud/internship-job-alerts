name: Internship Alerts (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run baseline once before production'
        required: true
        type: choice
        options:
          - baseline
          - production

permissions:
  contents: write

concurrency:
  group: internship-alert-state-main
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -p 'test_*.py'
      - name: Fetch, baseline, or deliver alerts
        id: monitor
        env:
          CANDIDATE_PROFILES_JSON: ${{ secrets.CANDIDATE_PROFILES_JSON }}
          INTERNSHIP_DISCORD_WEBHOOK_URL: ${{ secrets.INTERNSHIP_DISCORD_WEBHOOK_URL }}
          ALERT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set +e
          python internship_alerts.py "--${ALERT_MODE}"
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist public alert state
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f internship_alert_state.json ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internship_alert_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update internship alert state [skip ci]'
          git fetch origin main
          base_state=$(git rev-parse HEAD^:internship_alert_state.json 2>/dev/null || true)
          remote_state=$(git rev-parse origin/main:internship_alert_state.json 2>/dev/null || true)
          if [ "$base_state" != "$remote_state" ]; then
            echo 'Remote alert state changed during this run; refusing to overwrite it.' >&2
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main
      - name: Surface monitor health
        if: always()
        env:
          MONITOR_EXIT_CODE: ${{ steps.monitor.outputs.exit_code }}
        run: |
          if [ "$MONITOR_EXIT_CODE" != '0' ]; then
            echo 'Internship source or alert delivery failed; inspect sanitized monitor output.' >&2
            exit 1
          fi
